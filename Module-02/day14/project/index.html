<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Addis Eats</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Addis Eats</h1>
      <input
        type="text"
        id="search"
        placeholder="Search dishes..."
        aria-label="Search dishes"
      />
    </header>

    <main>
      <section id="menu" aria-label="Menu"></section>

      <aside id="cart" aria-label="Your order">
        <h2>Your Order</h2>
        <ul id="cart-items"></ul>
        <div id="cart-summary">
          <p>Total: <span id="cart-total">0</span> ETB</p>
        </div>

        <form id="checkout" novalidate>
          <h3>Checkout</h3>
          <label
            >Name
            <input type="text" id="name" required />
          </label>
          <label
            >Phone (TeleBirr)
            <input type="text" id="phone" required />
          </label>
          <label
            >Delivery area
            <select id="area">
              <option>Bole</option>
              <option>Kazanchis</option>
              <option>Megenagna</option>
            </select>
          </label>
          <p id="form-error" class="error" aria-live="polite"></p>
          <button type="submit">Place Order</button>
        </form>
        <div id="confirmation" class="hidden"></div>
      </aside>
    </main>

    <footer>
      <p>Bole, Addis Ababa &bull; TeleBirr Supported</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
