• Build a reservation form: name, tel (pattern 09xxxxxxxx), guests (1–20), date
— each with a real <label>.
• Add the menu as a <table> with caption, scope and an ETB price column.
• Insert the hero image with meaningful alt and loading="lazy".
• Embed a Google Map iframe with a title attribute.
• Fill in <title>, meta description and one ordered heading outline.
• Tab through the whole page with no mouse; fix any trap. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="">
      <label for="name">Name:</label>
      <input id="name" name="name" type="text" required />
      <br />
      <label for="telephone">Tel: </label>
      <input id="tel" name="telephone" type="text" style="margin-top: 10px" />
    </form>
    <table>
      <thead>
        <tr>
          <th>Scope</th>
          <th>Price</th>
        </tr>
        <tbody>
          <tr>
            <td>Scope 1</td>
            <td>Price 1</td>
          </tr>
        </tbody>
        <tbody>
          <tr>
            <td>Scope 2</td>
            <td>Price 2</td>
          </tr>
        </tbody>
      </thead>
    </table>
    <img src="" alt="">
  </body>
</html>
