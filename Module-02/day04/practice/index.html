<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Day 04 Practice</title>
  </head>
  <body>
    <main class="page">
      <section class="demo">
        <h2>1. Navbar</h2>
        <nav class="navbar">
          <h1>Logo</h1>
          <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Menu</a>
            <a href="#">About</a>
            <button>Sign up</button>
          </div>
        </nav>
      </section>

      <section class="demo">
        <h2>2. Four Cards</h2>
        <div class="cards-row">
          <article class="box">Card 1</article>
          <article class="box">Card 2</article>
          <article class="box">Card 3</article>
          <article class="box">Card 4</article>
        </div>
      </section>

      <section class="demo">
        <h2>3. Photo Gallery</h2>
        <div class="gallery">
          <div class="photo">Photo 1</div>
          <div class="photo">Photo 2</div>
          <div class="photo">Photo 3</div>
          <div class="photo">Photo 4</div>
          <div class="photo">Photo 5</div>
          <div class="photo">Photo 6</div>
        </div>
      </section>

      <section class="demo">
        <h2>4. Page Layout</h2>
        <div class="layout-page">
          <header class="area header">Header</header>
          <aside class="area sidebar">Sidebar</aside>
          <main class="area main-area">Main</main>
          <footer class="area footer">Footer</footer>
        </div>
      </section>

      <section class="demo">
        <h2>5. Product Card</h2>
        <article class="product-card">
          <span class="sale-badge">ETB Sale</span>
          <h3>Simple Shoes</h3>
          <p>Basic product card with a badge in the corner.</p>
          <strong>$25</strong>
        </article>
      </section>
    </main>
  </body>
</html>
